<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050308">
<title>Для Барсбек ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i></div>
<div id="hearts" aria-hidden="true"></div>

<!-- Экран 1: имя -->
<section class="screen" id="screen-name">
  <form class="card" id="name-form" novalidate>
    <div class="deco" aria-hidden="true">♥</div>
    <h1>Для кого эта история?</h1>
    <p class="sub">Кажется, я кое-кого здесь ждала...</p>
    <label class="sr" for="name-input">Введите имя</label>
    <div class="field"><input id="name-input" type="text" placeholder="Введите имя" autocomplete="off" autocapitalize="words" enterkeyhint="go"></div>
    <p class="msg" id="name-msg" role="alert" aria-live="polite"></p>
    <button class="btn" type="submit" aria-label="Продолжить">Продолжить ♥</button>
  </form>
</section>

<!-- Экран 2: дата -->
<section class="screen" id="screen-date">
  <form class="card" id="date-form" novalidate>
    <div class="deco" aria-hidden="true">♥</div>
    <h1>А теперь кое-что поважнее...</h1>
    <p class="sub">Когда мы познакомились?</p>
    <label class="sr" for="date-input">Дата в формате ДД/ММ/ГГГГ</label>
    <div class="field"><input id="date-input" type="text" inputmode="numeric" placeholder="ДД/ММ/ГГГГ" autocomplete="off" maxlength="10" enterkeyhint="go"></div>
    <p class="msg" id="date-msg" role="alert" aria-live="polite"></p>
    <button class="btn" type="submit" aria-label="Проверить дату">Проверить ♥</button>
  </form>
</section>

<!-- Переход -->
<section class="screen dark" id="screen-intro">
  <div class="intro-heart" aria-hidden="true">♥</div>
  <p class="intro-text">Тогда начнём нашу историю...</p>
</section>

<!-- Книга -->
<section class="screen" id="screen-book">
  <div class="stage"><div class="book" id="book"></div></div>
</section>

<!-- Финал -->
<section class="screen dark" id="screen-final">
  <div class="final-name" id="final-name">Раяна...</div>
  <div class="final-love" id="final-love">Люблю тебя ❤️</div>
  <div class="final-sub" id="final-sub"><span aria-hidden="true">♥</span><br>Навсегда в моей истории.</div>
</section>

<audio id="bgm" src="music.mp3" loop preload="none"></audio>
<button class="music" id="music" type="button" aria-label="Включить музыку" hidden>♫</button>
<button class="dev" id="dev" type="button" hidden>dev</button>
<script src="script.js"></script>
</body>
</html>
